# =============================================================================
# Nav2 Navigation Parameters for 4-Sensor EKF Fusion + SLAM Toolbox System
# =============================================================================
#
# 시스템 구성:
#   - 센서 융합: nav2_vslam_fused.launch.py (EKF: wheel + VSLAM + RF2O + IMU)
#   - 위치 추정: SLAM Toolbox (map→odom TF) + EKF (odom→base_footprint TF)
#   - 장애물 감지: RPLidar S2L (/scan)
#   - 오도메트리: /odom (EKF 융합 출력, 30Hz)
#
# TF 체인:
#   map → odom (SLAM Toolbox)
#       → base_footprint (EKF)
#           → base_link (URDF, +8cm Z)
#               → laser (URDF, -3cm X, +13cm Z, 180° yaw)
#
# 주의: AMCL 사용하지 않음 — SLAM Toolbox가 map→odom TF 제공
#       map_server 사용하지 않음 — SLAM Toolbox가 실시간 맵 제공
#
# 사용법:
#   1. nav2_vslam_fused.launch.py 먼저 실행 (센서 융합 + SLAM Toolbox)
#   2. 이 파일을 사용하는 nav2 launch를 별도로 실행
#
# =============================================================================

# ==============================================================
# Behavior Tree Navigator
# ==============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: False
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

# ==============================================================
# Controller Server (DWB Local Planner)
# ==============================================================
# Jupiter 차동구동 로봇 파라미터:
#   바퀴 지름: 68.5mm, 축간 거리: 329.11mm
#   최대 선속도: ~0.45 m/s, 최대 각속도: ~2.0 rad/s
# ==============================================================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0          # Jetson 부하 고려 (20→10Hz)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.05  # 미세 회전 허용 (이전 0.15)
    failure_tolerance: 3.0              # ⭐ 0.3→3.0 (inflated zone에서 DWB 일시 실패 허용, 30 cycles @10Hz)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03    # ⭐ 0.1→0.03 (제자리 회전 시 ~3cm drift로 progress 판정 통과)
      movement_time_allowance: 20.0     # ⭐ 15→20s (inflated corridor 통과 + 최종 회전에 충분한 시간)

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20          # ⭐ 0.15→0.20 (DWB xy_tol=0.25 보다 좁아야 함, 여유 확보)
      yaw_goal_tolerance: 0.15          # ⭐ 0.10→0.15 (~8.6°): RotateToGoal min_speed_theta=0.30 + MCU PID 오버슈트(~5°) > 5.7° → 수렴불가. 8.6°로 확대 [2026-03-20]

    # ==============================================================
    # RotationShimController → DWB 래핑
    # ==============================================================
    # 정지 상태에서 순수 회전(vx=0, vθ≠0) 시 양쪽 바퀴가 반대 방향으로
    # 정지마찰을 동시에 극복해야 하므로, DWB의 낮은 angular.z 출력으로는
    # 모터가 응답하지 못함 (데드존). RotationShimController가 정지 회전을
    # 고정 속도(0.8 rad/s)로 처리한 후, DWB에 전달.
    # ==============================================================
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.35        # ⭐ 45°→20°: RotationShim이 160° 회전 담당, DWB는 20°만 보정 [2026-03-19]
      forward_sampling_distance: 0.3     # ⭐ 0.5→0.3: 짧은 경로(0.5m 복귀)에서 RotationShim 활성화 보장 [2026-03-18]
      rotate_to_heading_angular_vel: 0.5 # ⭐ 0.8→0.5 [2026-03-20] 방안A-4 ESC deadzone skip 후 0.5도 즉시 토크 발생. 0.8은 PID 적분 모멘텀 과다→핸드오프 오버슈트
      max_angular_accel: 3.0             # ⭐ 5.0→3.0 [2026-03-20] 0.5 목표 시 5.0 불필요. 3.0이면 0→0.5 도달 0.17s. RotateToGoal 급가속 억제
      simulate_ahead_time: 1.0           # 충돌 검사 시뮬레이션 시간

      # DWB 파라미터 (primary_controller)
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35              # 보수적 선속도 (실내 안전)
      max_vel_y: 0.0               # 차동구동 — Y 속도 없음
      max_vel_theta: 1.0           # 각속도 최대값 (방안A 펌웨어 적용으로 1.0 복원)
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.15        # ⭐ 0.30→0.15 [2026-03-20] 방안A-4 ESC 스킵 후 0.15도 토크 발생. 0.30은 DWB 데드존(8.6°~14.3°) 생성→헌팅 원인
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.8           # 각가속도 (방안A 펌웨어 적용으로 0.8 복원)
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.8        # 각감속도 (방안A 펌웨어 적용으로 -0.8 복원)
      vx_samples: 20
      vy_samples: 1                # 차동구동이므로 Y 샘플 최소화
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5           # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
      xy_goal_tolerance: 0.25          # RotateToGoal 활성 영역 확대 — 회전 중 드리프트로 토글 방지
      trans_stopped_velocity: 0.05        # 정지 판정
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0   # ⭐ 2.0→5.0: 오버슈트 억제 — 목표 헤딩 근접 시 빠른 감속 [2026-03-19]
      RotateToGoal.lookahead_time: -1.0
      Twirling.scale: 5.0                # 경로 추종 중 불필요한 스핀 방지 (방안A 적용으로 5.0 복원)
      Oscillation.oscillation_reset_dist: 0.15
      Oscillation.oscillation_reset_angle: 0.30
      Oscillation.scale: 1.0              # 진동 페널티 (방안A 적용으로 1.0 복원)

# ==============================================================
# Planner Server (NavFn Global Planner)
# ==============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0     # Jetson CPU 부하 고려
    use_sim_time: False
    transform_tolerance: 0.5            # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.15                   # 목표 근접 경로 (이전 0.5 — 50cm 떨어진 곳에서 경로 종료 가능)
      use_astar: false
      allow_unknown: true               # SLAM 맵에서 미탐색 영역 허용

# ==============================================================
# Behavior Server (Recovery Behaviors)
# ==============================================================
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5            # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

# ==============================================================
# Local Costmap
# ==============================================================
# LiDAR /scan 기반 장애물 감지 (2D)
# SLAM Toolbox가 /scan을 사용하므로, costmap도 동일 센서 활용
# ==============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 0.5          # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
      # Jupiter footprint (360mm × 245mm)
      footprint: "[ [0.18, 0.1225], [0.18, -0.1225], [-0.18, -0.1225], [-0.18, 0.1225] ]"
      plugins: ["obstacle_layer", "nvblox_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0     # RPLidar S2L 최대 범위
          raytrace_min_range: 0.1
          obstacle_max_range: 5.0     # 장애물 감지 최대 범위
          obstacle_min_range: 0.1
          inf_is_valid: False
      # nvblox 3D → 2D ESDF costmap layer (Docker nvblox_node에서 발행)
      # nvblox_node 미실행 시 토픽 미수신 → 영향 없음 (graceful degradation)
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: "odom"   # local_costmap global_frame과 일치
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True     # NVIDIA 권장: inflation은 별도 layer 사용
        max_obstacle_distance: 1.0
        inflation_distance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # ⭐ 3.0→5.0 (inflation decay 가속 → 유효 inflation 폭 축소)
        inflation_radius: 0.30          # ⭐ 0.35→0.30 (inscribed 0.12m + 0.18m 안전여유)

# ==============================================================
# Global Costmap
# ==============================================================
# SLAM Toolbox가 제공하는 /map을 static layer로 사용
# + LiDAR /scan으로 동적 장애물 감지
# ==============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 0.5          # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
      footprint: "[ [0.18, 0.1225], [0.18, -0.1225], [-0.18, -0.1225], [-0.18, 0.1225] ]"
      resolution: 0.05
      track_unknown_space: true
      # SLAM Toolbox의 맵을 사용 — static_layer가 /map 토픽을 구독
      # ⭐ [2026-04-07] obstacle_layer 제거:
      #   - SLAM Toolbox가 /map을 통해 이미 장애물 정보 제공 (static_layer)
      #   - 실시간 장애물 회피는 local_costmap의 obstacle_layer가 담당
      #   - global costmap의 obstacle_layer는 중복이며, 로봇이 맵 경계에 있을 때
      #     "Sensor origin out of map bounds" 경고와 함께 raytrace 완전 실패
      #     (LiDAR가 base_link에서 -3cm X 오프셋 → 맵 좌측 경계와 겹침)
      plugins: ["static_layer", "nvblox_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # /map 토픽 (SLAM Toolbox 발행)을 자동 구독
      # nvblox 3D → 2D ESDF costmap layer (Docker nvblox_node에서 발행)
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: "map"    # global_costmap global_frame과 일치
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        max_obstacle_distance: 1.0
        inflation_distance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # ⭐ 3.0→5.0 (local과 동일 — inflation decay 가속)
        inflation_radius: 0.30          # ⭐ 0.35→0.30 (local과 동일)

# ==============================================================
# Velocity Smoother
# ==============================================================
# navigation_launch.py가 기본 생성하는 velocity_smoother 노드의 파라미터
# controller_server → /cmd_vel_nav → velocity_smoother → /cmd_vel → driver
# 이 설정 없으면 기본값(max_accel:[2.5,0,3.2]) 사용 — 로봇 특성과 불일치 [2026-03-18]
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.0]       # 로봇 최대 속도 (max_vel_x, 0, max_vel_theta)
    min_velocity: [-0.35, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.5]           # ⭐ angular 0.8→2.5: ESC 데드존 구간 빠르게 통과 [2026-03-19]
    max_decel: [-0.5, 0.0, -2.5]         # ⭐ angular -0.8→-2.5: 회전 정지 시 데드존 통과 최소화 [2026-03-19]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.05]  # ⭐ 0.20→0.05: 0.20은 DWB 헤딩보정(0.05~0.15) 차단→Goal1 TIMEOUT. 노이즈만 필터링 [2026-03-19]
    velocity_timeout: 1.0

# ==============================================================
# Waypoint Follower
# ==============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
