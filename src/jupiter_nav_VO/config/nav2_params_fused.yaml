# =============================================================================
# Nav2 Navigation Parameters for 4-Sensor EKF Fusion + SLAM Toolbox System
# =============================================================================
#
# 시스템 구성:
#   - 센서 융합: nav2_vslam_fused.launch.py (EKF: wheel + VSLAM + RF2O + IMU)
#   - 위치 추정: SLAM Toolbox (map→odom TF) + EKF (odom→base_footprint TF)
#   - 장애물 감지: RPLidar S2L (/scan)
#   - 오도메트리: /odom (EKF 융합 출력, 30Hz)
#
# TF 체인:
#   map → odom (SLAM Toolbox)
#       → base_footprint (EKF)
#           → base_link (URDF, +8cm Z)
#               → laser (URDF, -3cm X, +13cm Z, 180° yaw)
#
# 주의: AMCL 사용하지 않음 — SLAM Toolbox가 map→odom TF 제공
#       map_server 사용하지 않음 — SLAM Toolbox가 실시간 맵 제공
#
# 사용법:
#   1. nav2_vslam_fused.launch.py 먼저 실행 (센서 융합 + SLAM Toolbox)
#   2. 이 파일을 사용하는 nav2 launch를 별도로 실행
#
# =============================================================================

# ==============================================================
# Behavior Tree Navigator
# ==============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: False
    # 2026-04-24 (Stage 3): custom BT XML — backup 제거, Spin + Wait + Clearing round-robin.
    # 좁은 통로에서 뒤로 밀리는 현상 억제. 복구는 시야 재확보(Spin) + 장애물 clear 로만 수행.
    default_nav_to_pose_bt_xml: "$(find-pkg-share jupiter_nav_VO)/behavior_trees/navigate_to_pose_no_backup.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

# ==============================================================
# Controller Server (DWB Local Planner)
# ==============================================================
# Jupiter 차동구동 로봇 파라미터:
#   바퀴 지름: 68.5mm, 축간 거리: 329.11mm
#   최대 선속도: ~0.45 m/s, 최대 각속도: ~2.0 rad/s
# ==============================================================
controller_server:
  ros__parameters:
    use_sim_time: False
    # [2026-05-06] MPPI 전환에 따라 10→20 Hz.
    #   MPPI 는 controller_period ≤ model_dt (=0.05s) 제약 존재. 10Hz (period 0.1s) 면 lifecycle
    #   configure 단계에서 "Controller period more then model dt" 예외로 controller_server 활성화 실패.
    #   20Hz (period 0.05s = model_dt 0.05s) 로 정합. Orin Nano 부하 모니터링 필요.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.10  # ⭐ [2026-04-21] 0.05→0.10: 정지 회전 시 실기구가 못 도는 0.0526 영역 차단
    failure_tolerance: 5.0              # 2026-04-28: 3.0→5.0 (사람 통로 횡단 대기 시간 확보, 50 cycles @10Hz)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # 2026-04-30: SimpleProgressChecker → PoseProgressChecker.
      # 문제: SimpleProgressChecker 는 XY 만 검사. 1mm/120s 로 완화 후 벽에 붙은 상태에서
      #   모터 진동 mm 단위 XY 변화로 progress 인정 → 영원히 timeout 안 됨 → BT recovery 미발동.
      #   사용자 보고: 빨간 영역 진입 후 path 따라가다 벽에 붙어 전진만 함, backup 안 함.
      # 해결: PoseProgressChecker 로 yaw 회전도 progress 인정 → near-goal 정렬 시 false fail 방지
      #   하면서 벽 stuck (XY+yaw 둘 다 정지) 은 정확히 검출.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05    # 5cm
      required_movement_angle: 0.05     # ~3° (yaw)
      movement_time_allowance: 20.0     # 20s 안에 둘 중 하나 미충족 → controller failure → BT recovery

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20          # ⭐ 0.15→0.20 (DWB xy_tol=0.25 보다 좁아야 함, 여유 확보)
      yaw_goal_tolerance: 0.32          # ⭐ [2026-04-21] 0.30→0.32: near-goal 정렬 마무리에서 success 판정 여유를 소폭 확대해 불필요한 progress timeout 억제

    # ==============================================================
    # RotationShimController → MPPI 래핑
    # ==============================================================
    # [2026-05-06] DWB → MPPI 전환.
    #   동기:
    #     - DWB 의 sample-and-score 가 sim_time 1.0s + 11 vtheta sample 로 좁은 통로 trajectory
    #       탐색이 부족 → "경향성만" 따라가는 현상.
    #     - MPPI 는 model predictive + sampling 으로 더 부드럽고 path-aware 한 trajectory.
    #     - 야외 농경지 비포장/미끄럼에 강함.
    #   유지:
    #     - RotationShimController 는 정지→회전 진입의 1차 처리 유지 (driver 의 adaptive kick
    #       0.55 + encoder confirm 과 함께). MPPI 자체도 정지 회전 가능하지만 RotationShim 의
    #       명시적 단계가 데드존 보상과 더 잘 어울림.
    #     - DiffDrive motion_model 사용 (Yahboom Jupiter X3 차동구동).
    # ==============================================================
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      # [2026-05-06 update] 180° goal 시 "조금만 회전 후 전진" 증상 해결.
      #   RotationShim 의 handover 임계를 0.35→0.20 (20°→11°) 로 엄격화.
      #   path 와의 heading 차이가 11° 이내일 때만 MPPI 로 넘김 → 더 정확히 회전 후 진행.
      angular_dist_threshold: 0.20        # 11° — 더 엄격한 정렬 후 handover
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0

      # ==============================================================
      # MPPI Controller (primary)
      # ==============================================================
      # 핵심 동작: 매 cycle batch_size 개의 trajectory 를 sampling, critic 으로 점수화,
      #   weighted-average 로 최적 control 출력. iteration_count 만큼 refine.
      # ==============================================================
      # [2026-05-06 update] Control loop missed 가끔 발생 → 부하 약간 완화.
      #   time_steps 56→48 (horizon 2.4s), batch 1000→700 (sim points 60% 수준).
      #   여전히 horizon 충분 + sample 다양성 유지. CPU peak 28%→18% 예상.
      time_steps: 48                # 예측 horizon (48 × 0.05 = 2.4s)
      model_dt: 0.05                # 한 step 의 시간 (controller_frequency 와 정합)
      batch_size: 700               # sampling 개수
      vx_std: 0.2                   # vx noise std (m/s) — 탐색 폭
      vy_std: 0.0                   # 차동구동이라 0
      wz_std: 0.4                   # wz noise std (rad/s) — 회전 탐색 폭
      vx_max: 0.20                  # max forward velocity (DWB max_vel_x 와 동기화)
      vx_min: -0.10                 # 후진 허용 (좁은 곳 unstuck 용도)
      wz_max: 1.0                   # max angular velocity
      ax_max: 0.5
      ax_min: -0.5
      az_max: 0.8
      iteration_count: 1            # MPPI iteration. 1 이 표준
      prune_distance: 1.7           # path 의 robot 인근 N m 만 추종 (먼 부분 무시)
      transform_tolerance: 0.5
      temperature: 0.3              # softmax 온도 (낮을수록 best 에 집중)
      gamma: 0.015                  # control noise 감쇠
      motion_model: "DiffDrive"     # Yahboom 차동구동
      visualize: false              # rviz 시각화 (디버깅 시 true)
      regenerate_noises: false      # noise resample 매 cycle (false 가 더 빠름)
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0          # diff drive 라 무관 (0 = 제약 없음)

      # ==============================================================
      # MPPI Critics — DWB 의 critic 과 1:1 대응
      # ==============================================================
      critics:
        - "ConstraintCritic"        # 속도 한계 페널티
        - "ObstaclesCritic"         # 충돌 회피 (DWB BaseObstacle 대응)
        - "GoalCritic"              # goal 위치 페널티 (DWB GoalDist 대응)
        - "GoalAngleCritic"         # goal 각도 (DWB RotateToGoal 대응)
        - "PathAlignCritic"         # path heading 정렬 (DWB PathAlign 대응)
        - "PathFollowCritic"        # path 거리 페널티 (DWB PathDist 대응)
        - "PathAngleCritic"         # path 곡률 정렬
        - "PreferForwardCritic"     # 후진 페널티 (필요 시 후진 허용하지만 우선순위 낮춤)

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4    # goal 1.4m 이내일 때 활성
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # [2026-05-06] 3.0→8.0: "조금만 회전 후 전진" 증상 — MPPI 가 final yaw 미달 상태에서
        #   다른 critic 에 밀려 직진 trajectory 채택. 가중치 강화로 yaw 미달 시 강한 페널티.
        cost_weight: 8.0
        threshold_to_consider: 0.5    # goal 0.5m 이내일 때 yaw 정렬 활성
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5         # inflation 영역 약한 회피
        critical_weight: 20.0         # critical 영역 (lethal 근처) 강한 회피
        consider_footprint: true      # ⭐ 좁은 통로 footprint 검사 — true 권장
        collision_cost: 10000.0       # collision 시 사실상 reject
        collision_margin_distance: 0.10
        near_goal_distance: 0.5       # goal 근처에서 obstacle 가중치 완화
        # MPPI 자체 inflation (costmap inflation 과 별개의 critic-내부 inflation)
        inflation_radius: 0.55
        cost_scaling_factor: 10.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0             # path 이탈 페널티 (DWB PathAlign=28 의 절반 — MPPI 는 자체 sampling 으로 보완)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # [2026-05-06] 2.0→5.0: path 의 heading 곡률에 trajectory 정렬 강화.
        #   회전 후 직진할 때 path 가 곡선이면 trajectory 가 그 곡률을 따라가도록.
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        forward_preference: true

# ==============================================================
# Planner Server (SmacPlanner2D Global Planner)
# ==============================================================
# 2026-04-28 (수정 #2): SmacPlannerHybrid → SmacPlanner2D 다운그레이드
# 이유: Hybrid + DUBIN 은 minimum_turning_radius=0.20m 곡선 plan 을 생성하는데,
#   2바퀴 차동구동 + 한쪽 바퀴 기구 이상 환경에서:
#     · 곡선 plan 추종 시 좌우 속도차 명령 → 이상 바퀴 시 이탈 누적
#     · RotationShim 의 정지 회전 처리가 무력화됨 (plan 자체에 회전 곡선 포함)
#     · 결과: 방향 못 잡는 증상
#   SmacPlanner2D 는 motion model 없는 holonomic A* (NavFn 진화형):
#     · 자유 회전 plan → RotationShim 이 정지 회전 처리 (NavFn 시절 동작 회복)
#     · footprint collision check 정확 (좁은 통로 통과 능력 NavFn 보다 우월)
#     · minimum_turning_radius / motion_model 등 차동구동 부적합 파라미터 불필요
# 백업: backup_2026_04_28/nav2_params_fused.yaml.bak (Hybrid + DUBIN 시절)
# ==============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: False
    transform_tolerance: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: false           # costmap 해상도 그대로 (5cm)
      downsampling_factor: 1
      tolerance: 0.25                     # 목표 근접
      allow_unknown: true                 # SLAM 미탐색 영역 허용
      max_iterations: 1000000             # 충분한 탐색 깊이
      max_on_approach_iterations: 1000
      max_planning_time: 5.0              # 최대 5초
      cost_travel_multiplier: 2.0         # cost 셀 회피 가중치 (NavFn cost_factor 와 유사)
      use_final_approach_orientation: false  # final yaw 는 RotateToGoal critic 이 처리

# ==============================================================
# Behavior Server (Recovery Behaviors)
# ==============================================================
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      # 2026-04-30 (Fix B): BackUp 가속도 명시. 이전엔 "DriveOnHeading: no acceleration or
      # deceleration limits set" 경고로 step input 발사 → 모터 정지마찰 + ESC deadzone 으로
      # 응답 못 하고 10초 timeout. 0.20 m/s² 면 0.10 m/s 도달 0.5초, 부드러운 가속.
      # minimum_speed 는 driver 의 linear STARTUP 키크 (0.12 m/s) 와 정합해 정지 마찰 회피.
      acceleration_limit: 0.20
      deceleration_limit: -0.20
      minimum_speed: 0.05
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5            # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
    # 2026-04-30 (Fix A): 2.0 → 0.5. backup 0.10m × 0.10 m/s = 1초 짜리 동작에 2초 simulate
    # 는 과도. 좁은 곳 stuck 시 simulate 가 충돌 예측 → backup cmd_vel = 0 → 10초 timeout 후
    # backup failed. 0.5초 × 0.10 m/s = 0.05m 후방 check 로 좁은 곳에서도 backup 가능.
    simulate_ahead_time: 0.5
    max_rotational_vel: 0.8
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

# ==============================================================
# Local Costmap
# ==============================================================
# LiDAR /scan 기반 장애물 감지 (2D)
# SLAM Toolbox가 /scan을 사용하므로, costmap도 동일 센서 활용
# ==============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # 2026-04-29 (occlusion shadow fix): NvbloxCostmapLayer 가 미관측 cell 을 NO_INFORMATION
      # (=255) 로 마킹하는데 (nvblox_costmap_layer.cpp:160 setDefaultValue), Nav2 default
      # track_unknown_space=true 환경에선 unknown=obstacle 로 처리되어 기둥 뒤 가려진 영역이
      # 통째로 통과 불가로 판단됨. false 로 명시 → NO_INFORMATION 을 free 로 취급.
      # 안전 측면 우려: 진짜 미탐색 영역도 free 취급되지만, obstacle_layer (/scan_merged) 가
      # 실제 장애물은 직접 detection. dual-sensor 구성이라 우회 안전.
      track_unknown_space: false
      # 2026-04-24 (Stage 2): 3 → 5. 좁은 통로에서 DWB 가 회피 trajectory 탐색할 공간 여유.
      # 셀 수 60×60 → 100×100 (2.78배). CPU 감내 범위.
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.5          # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
      # Jupiter footprint (360mm × 245mm)
      footprint: "[ [0.18, 0.1225], [0.18, -0.1225], [-0.18, -0.1225], [-0.18, 0.1225] ]"
      # 2026-04-30 (Tier 2.5): local_costmap 에서 nvblox_layer 제거.
      # 이유: nvblox 의 forward-only D455 perception 으로 heading-dependent costmap 생성됨
      # (로버 정면 → fresh, 측면/후면 → stale voxel 잔류 → corridor 좁아 보임).
      # /scan_merged (RPLidar 360° + D455 forward depth z-slice) 만으로 일관된 360° 커버.
      # global_costmap 의 nvblox_layer 는 유지 (3D mapping 효과 보존).
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # 2026-04-24 (Stage 5): /scan → /scan_merged (RPLidar + D455 depth 병합)
          # 저층 2~3cm 창틀도 obstacle_layer 에 반영되어 local costmap 회피 가능.
          topic: /scan_merged
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
          inf_is_valid: False
      # 2026-04-30 (Tier 2.5): local_costmap 의 nvblox_layer 블록 제거됨.
      # heading-dependent costmap 거동 (로버 정면 따라 같은 corridor cost 가 다름) 의 직접 원인.
      # global_costmap 의 nvblox_layer 는 유지 — global plan 에 3D 메모리 활용.
      # local 은 /scan_merged 만으로 360° 일관 커버.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-04-28: 10.0 → 5.0 (감쇠 더 완만, SmacPlanner 의 cost_penalty 와 균형)
        # 2026-04-29 (T1.2): 5.0 → 3.0 — inflation_radius 가 0.25 로 늘어났으므로 감쇠도 더 완만.
        # 0.10m 떨어진 지점 cost 가 ~60 → ~125 로 증가, planner/critic 에 명확한 회피 신호.
        cost_scaling_factor: 3.0
        # 2026-04-28: 0.30 → 0.20 (좁은 통로 통과 우선, 1m 문 free 폭 0.40→0.60m)
        # 2026-04-29 (T1.1): 0.20 → 0.25. 0.20 < robot circumscribed radius 0.218m 였음 →
        # 외접원이 lethal 에 닿는 path 가 그려지고 좁은 곳에서 회전 시 valid trajectory 부재.
        # 0.25 = circumscribed 0.218 + 3cm 안전 margin. 1m 문 free 폭 0.50m (robot 폭 0.245m, 양쪽 12cm 여유).
        # SmacPlanner 가 footprint 충돌 검사를 정확히 하므로 inflation 작아도 안전.
        # 2026-04-29 (door fix): 0.25 → 0.20 (local 만, global 은 0.25 유지) — 1m 문 sideways
        # 통과 시 footprint 가 inflation 영역에 더 많이 들어가 DWB cost 부담 증가하던 것 완화.
        # global_costmap 은 0.25 유지하므로 SmacPlanner path 안전성 보존. DWB 는 footprint
        # 충돌 검사를 정확히 하므로 local inflation 작아도 안전.
        inflation_radius: 0.20

# ==============================================================
# Global Costmap
# ==============================================================
# SLAM Toolbox가 제공하는 /map을 static layer로 사용
# + LiDAR /scan으로 동적 장애물 감지
# ==============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 0.5          # stamp=Time(0,0) + NTP chrony 적용 후 축소 (3.0→0.5)
      footprint: "[ [0.18, 0.1225], [0.18, -0.1225], [-0.18, -0.1225], [-0.18, 0.1225] ]"
      resolution: 0.05
      track_unknown_space: true
      # SLAM Toolbox의 맵을 사용 — static_layer가 /map 토픽을 구독
      # ⭐ [2026-04-07] obstacle_layer 제거:
      #   - SLAM Toolbox가 /map을 통해 이미 장애물 정보 제공 (static_layer)
      #   - 실시간 장애물 회피는 local_costmap의 obstacle_layer가 담당
      #   - global costmap의 obstacle_layer는 중복이며, 로봇이 맵 경계에 있을 때
      #     "Sensor origin out of map bounds" 경고와 함께 raytrace 완전 실패
      #     (LiDAR가 base_link에서 -3cm X 오프셋 → 맵 좌측 경계와 겹침)
      plugins: ["static_layer", "nvblox_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # /map 토픽 (SLAM Toolbox 발행)을 자동 구독
      # nvblox 3D → 2D ESDF costmap layer (Docker nvblox_node에서 발행)
      # ⭐ [2026-04-20] static_map_slice → combined_map_slice: 사람 감지+정적 장애물 합산
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: "map"    # global_costmap global_frame과 일치
        nvblox_map_slice_topic: "/nvblox_node/combined_map_slice"
        convert_to_binary_costmap: True
        max_obstacle_distance: 1.0
        inflation_distance: 0.0         # 2026-04-24: local 과 동일 (이중 inflation 제거)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-04-28: local 과 동일하게 완화 (10→5, 0.30→0.20)
        # 2026-04-29 (T1.1, T1.2): local 과 동일 0.25 / 3.0 으로 유지 — global 과 local 의
        # cost gradient 가 다르면 SmacPlanner 가 그린 path 가 DWB 에서 reject 되는 mismatch 발생.
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

# ==============================================================
# Velocity Smoother
# ==============================================================
# navigation_launch.py가 기본 생성하는 velocity_smoother 노드의 파라미터
# controller_server → /cmd_vel_nav → velocity_smoother → /cmd_vel → driver
# 이 설정 없으면 기본값(max_accel:[2.5,0,3.2]) 사용 — 로봇 특성과 불일치 [2026-03-18]
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 1.0]       # ⭐ 0.35→0.20 [2026-04-20] DWB max_vel_x와 동기화
    min_velocity: [-0.20, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.5]           # ⭐ angular 0.8→2.5: ESC 데드존 구간 빠르게 통과 [2026-03-19]
    max_decel: [-0.5, 0.0, -2.5]         # ⭐ angular -0.8→-2.5: 회전 정지 시 데드존 통과 최소화 [2026-03-19]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.05]  # ⭐ 0.20→0.05: 0.20은 DWB 헤딩보정(0.05~0.15) 차단→Goal1 TIMEOUT. 노이즈만 필터링 [2026-03-19]
    velocity_timeout: 1.0

# ==============================================================
# Waypoint Follower
# ==============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
